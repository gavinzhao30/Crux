ly="Helvetica,Arial,sans-serif">C = blue</text><rect x="111.55" y="197.6" width="12" height="8" fill="#000000"/><text x="126.55" y="203.6" font-size="3.6" fill="#222222" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">G = black</text><rect x="156.55" y="197.6" width="12" height="8" fill="#E3191B"/><text x="171.55" y="203.6" font-size="3.6" fill="#222222" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">T = red</text><text x="21.55" y="213.6" font-size="3" fill="#444444" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">ID boxes: window 1 fills box 1, window 2 box 2, window 3 box 3; the calibration card fills all three.</text><text x="21.55" y="218.6" font-size="3" fill="#444444" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">The black square at the top left is the orientation mark; keep the bottom right corner white.</text><text x="21.55" y="223.6" font-size="3" fill="#444444" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">Hand-drawn card: frame 180 x 68 mm, frame 5 mm thick; see labs/oneletter/strips/README.md.</text></svg>

ica,Arial,sans-serif">C</text><rect x="44" y="23" width="15" height="22" fill="#000000"/><text x="51.5" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">G</text><rect x="65.5" y="23" width="15" height="22" fill="#E3191B"/><text x="73" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">T</text><rect x="82.5" y="23" width="15" height="22" fill="none" stroke="#BBBBBB" stroke-width="0.4"/><rect x="99.5" y="23" width="15" height="22" fill="#E3191B"/><text x="107" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">T</text><rect x="121" y="23" width="15" height="22" fill="#000000"/><text x="128.5" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">G</text><rect x="138" y="23" width="15" height="22" fill="#1E6FD9"/><text x="145.5" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">C</text><rect x="155" y="23" width="15" height="22" fill="#00A651"/><text x="162.5" y="80" font-size="8" fill="#444444" text-anchor="middle" font-weight="bold" font-family="Helvetica,Arial,sans-serif">A</text><text x="0" y="-4" font-size="4.5" fill="#444444" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">colour calibration card</text></g><g transform="translate(26.95 109.90) scale(0.9)"><line x1="-6" y1="-9" x2="186" y2="-9" stroke="#999999" stroke-width="0.3" stroke-dasharray="2 1.5"/><line x1="186" y1="-9" x2="186" y2="83" stroke="#999999" stroke-width="0.3" stroke-dasharray="2 1.5"/><line x1="186" y1="83" x2="-6" y2="83" stroke="#999999" stroke-width="0.3" stroke-dasharray="2 1.5"/><line x1="-6" y1="83" x2="-6" y2="-9" stroke="#999999" stroke-width="0.3" stroke-dasharray="2 1.5"/><rect x="0" y="0" width="180" height="68" fill="#000000
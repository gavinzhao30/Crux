[project]
name = "crux"
version = "0.1.0"
description = "Experiment-driven scientific agents"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2.5.4",
    "openai>=1.60",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve the upstream wrapper's existing TypeVar signatures.
"agents/llm.py" = ["UP047"]

[tool.ruff.format]
exclude = ["*.md"]
